services:
  whisper-service:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: whisper-core
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - ASR_ENGINE=faster_whisper           # 使用 CTranslate2 加速
      - ASR_MODEL=medium                    # CPU 机型推荐 medium
      - ASR_DEVICE=cpu
      - ASR_QUANTIZATION=int8               # Faster-Whisper int8 量化
      - ASR_THREADS=8                       # 与 8 核 CPU 对齐
      - LOG_LEVEL=INFO
      - BEAM_SIZE=3
      - BATCH_SIZE=8
    volumes:
      - ./data/models:/root/.cache/whisper  # 缓存模型，避免重复下载
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              urllib.request.urlopen("http://localhost:9000/", timeout=5).read()
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 5

  webapp:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whisper-webui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DATA_DIR=/app/data/media
    volumes:
      - ./data/media:/app/data/media
    depends_on:
      whisper-service:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: whisper-worker
    restart: unless-stopped
    environment:
      - WHISPER_API_URL=http://whisper-service:9000
      - DATA_DIR=/app/data/media
      - POLLING_INTERVAL=5
    volumes:
      - ./data/media:/app/data/media
    depends_on:
      whisper-service:
        condition: service_healthy
